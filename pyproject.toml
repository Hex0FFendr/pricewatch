[project]
name = "pricewatch"
version = "0.1.0"
description = "Self-hosted price and stock monitor for saved items on UK retail accounts"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "playwright>=1.61.0",
    "pydantic>=2.7",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
pricewatch = "pricewatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricewatch"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "TRY",  # tryceratops
    "ANN",  # flake8-annotations
    "BLE",  # flake8-blind-except
    "S",    # flake8-bandit
    "RUF",
]
ignore = [
    "TRY003",  # long messages outside exception class: we want readable errors
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ARG001",  # pytest fixtures are declared as unused-looking arguments
    "ARG002",  # ditto, on methods
    "ANN401",  # test helpers take heterogeneous kwargs
    "SIM117",  # nested `with` is clearer when the blocks mean different things
    "S101",    # assert is the point
    "S105",    # test fixtures contain credential-shaped literals by design
    "S106",
    "TRY301",  # tests raise inline to exercise error paths
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
